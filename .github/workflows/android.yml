name: Build APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Version
        run: echo "VC=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - run: gradle assembleDebug --no-daemon -Pvc=$VC
      - run: cp app/build/outputs/apk/debug/app-debug.apk svitlo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VC }}
          name: Svitlo v${{ env.VC }}
          files: svitlo.apk
