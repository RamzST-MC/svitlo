name: Build APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', '.github/workflows/android.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with: 
          distribution: 'temurin'
          java-version: '17'
          
      - uses: android-actions/setup-android@v3
      
      - uses: gradle/actions/setup-gradle@v4
        with: 
          gradle-version: '8.10.2'
      
      - name: Read version from gradle.properties
        id: ver
        run: |
          VERSION_NAME=$(grep '^versionName=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          VERSION_CODE=$(grep '^versionCode=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION_NAME (code: $VERSION_CODE)"
      
      - name: Build APK
        run: gradle assembleDebug --no-daemon -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}
      
      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk svitlo-v${{ steps.ver.outputs.name }}.apk
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Svitlo v${{ steps.ver.outputs.name }}
          files: svitlo-v${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true